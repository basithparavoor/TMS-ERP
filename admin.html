<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration Suite — THAIBA MODEL SCHOOL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
  <link rel="stylesheet" href="app.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="ambient-mesh">
    <div class="mesh-glow-1"></div>
    <div class="mesh-glow-2"></div>
  </div>

  <div style="min-height: 100vh; display: flex; flex-direction: column;">
    <!-- Portal Header -->
    <header class="app-topbar">
      <div class="topbar-left">
        <a href="index.html#/dashboard" class="brand-badge" style="padding: 6px 12px; font-size: 0.95rem;">TMS</a>
        <div style="font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;">
          THAIBA MODEL SCHOOL — School Administration Portal
        </div>
      </div>
      <div class="topbar-right">
        <a href="index.html#/dashboard" class="btn btn-secondary btn-sm"><i data-lucide="layout-dashboard"></i> Main ERP</a>
        <button class="icon-btn" id="theme-toggle-btn"><i data-lucide="moon"></i></button>
      </div>
    </header>

    <div class="app-viewport" id="admin-portal-viewport">
      <!-- Admin module content rendered dynamically -->
    </div>
  </div>

  <script type="module">
    import { AdminModule } from './admin-module.js';
    import { authService } from './auth-service.js';
    import { UIComponents } from './ui-components.js';

    if (!authService.isAuthenticated()) {
      window.location.href = 'login.html';
    } else {
      UIComponents.initTheme();
      const themeBtn = document.getElementById('theme-toggle-btn');
      if (themeBtn) themeBtn.addEventListener('click', () => UIComponents.toggleTheme());

      const viewport = document.getElementById('admin-portal-viewport');
      AdminModule.render(viewport);
    }
  </script>
</body>
</html>
