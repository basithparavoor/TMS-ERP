<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THAIBA MODEL SCHOOL — Enterprise Management Suite</title>
  <link rel="icon" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TMS ERP">
  <link rel="stylesheet" href="app.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div id="app-root">
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;">
      <div style="font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 800; color: #16a34a; letter-spacing: 0.04em;">
        THAIBA MODEL SCHOOL
      </div>
      <p style="color: #64748b; font-size: 0.9rem;">Initializing Campus Enterprise Platform...</p>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration skipped:', err));
      });
    }
  </script>
</body>
</html>
