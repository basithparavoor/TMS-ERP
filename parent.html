<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Portal — THAIBA MODEL SCHOOL</title>
  <link rel="icon" type="image/png" href="./icons/tms-logo.png">
  <link rel="apple-touch-icon" href="./icons/tms-logo.png">
  <link rel="stylesheet" href="app.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="ambient-mesh">
    <div class="mesh-glow-1"></div>
    <div class="mesh-glow-2"></div>
  </div>

  <div style="min-height: 100vh; display: flex; flex-direction: column;">
    <header class="app-topbar">
      <div class="topbar-left">
        <span class="brand-badge" style="padding: 6px 12px; font-size: 0.95rem;">TMS</span>
        <div style="font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;">
          Parent &amp; Guardian Portal
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="notification-bell" title="Notifications" style="position: relative;">
          <i data-lucide="bell"></i>
          <span id="notification-badge" class="badge badge-danger" style="display: none; position: absolute; top: -4px; right: -4px; font-size: 0.58rem; padding: 1px 5px; line-height: 1.4;">0</span>
        </button>
        <button class="icon-btn" id="btn-logout" title="Sign Out"><i data-lucide="log-out"></i></button>
      </div>
    </header>

    <div class="app-viewport">
      <div style="max-width: 1000px; margin: 0 auto;" id="parent-content">
        <div class="card"><p style="text-align:center; color:var(--text-muted); padding:40px;">Loading your portal…</p></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { authService } from './auth-service.js';
    import { UIComponents } from './ui-components.js';
    import { TMS_CONFIG } from './config.js';
    import { admissionService } from './admission-service.js';
    import { notificationService } from './notification-service.js';
    import { NotificationCenter } from './notification-center.js';
    import { brandingService } from './branding-service.js';
    import { dbService } from './supabase-client.js';
    import { StudentLeaveService } from './student-leave-service.js';
    import { admissionService } from './admission-service.js';

    const esc = (v) => UIComponents.escapeHtml(v);
    const fmtDate = (v) => { if (!v) return '—'; const d = new Date(v); return isNaN(d.getTime()) ? '—' : d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); };
    const fmtMoney = (v) => `₹ ${Number(v || 0).toLocaleString('en-IN')}`;

    const STEPS = ['Submitted', 'Under Verification', 'Approved', 'Enrolled'];

    function stepper(status) {
      if (status === 'Rejected') {
        return `<div style="background: rgba(239,68,68,0.08); border-left:4px solid #ef4444; padding:12px; border-radius:8px; font-weight:600; color:#b91c1c;">
          <i data-lucide="x-circle" style="width:16px;height:16px;vertical-align:middle;"></i> Application Rejected</div>`;
      }
      const current = STEPS.indexOf(status === 'Submitted' ? 'Submitted' : status);
      return `<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        ${STEPS.map((s, i) => {
          const done = i <= current;
          return `<span class="badge ${done ? 'badge-success' : 'badge-info'}" style="padding:6px 12px; opacity:${done ? 1 : 0.45}; font-weight:700;">${esc(s)}</span>${i < STEPS.length - 1 ? '<i data-lucide="arrow-right" style="width:14px;height:14px;color:var(--text-subtle);"></i>' : ''}`;
        }).join('')}
      </div>`;
    }

    function applicationCard(a) {
      const payments = Array.isArray(a.payments) ? a.payments : [];
      const ledger = payments.length
        ? payments.map((p) => `<tr><td>${fmtDate(p.date)}</td><td>${esc(p.mode)}</td><td>${esc(p.reference || '—')}</td><td style="text-align:right;">${fmtMoney(p.amount)}</td></tr>`).join('')
        : '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);">No payments recorded.</td></tr>';

      const exam = a.entranceExam || (a.payload && a.payload.entranceExam) || {};
      const isLive = admissionService.isExamPublished(exam);
      const isScheduled = exam.isPublished && !isLive;
      const hasScore = exam.totalScore != null || exam.writtenScore != null;

      let examSectionHtml = '';
      if (isLive) {
        // Marks officially published!
        examSectionHtml = `
          <div style="background:linear-gradient(135deg, rgba(22,163,74,0.06), rgba(37,99,235,0.06)); border:1.5px solid #86efac; border-radius:10px; padding:16px; margin:16px 0;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
              <div>
                <span class="badge badge-success" style="font-weight:800; font-size:0.75rem;"><i data-lucide="check-circle" style="width:12px;height:12px;vertical-align:middle;"></i> Official Marks Published</span>
                <h4 style="font-size:1.1rem; font-weight:800; color:#15803d; margin:6px 0 2px 0;">${esc(exam.examName || 'Weekly Admission Assessment')}</h4>
                <div style="font-size:0.75rem; color:#64748b;">
                  Conducted: <strong>${fmtDate(exam.examDate)}</strong> &bull; Released on: <strong>${fmtDate(exam.publishDate)}</strong>
                </div>
              </div>
              <button type="button" class="btn btn-secondary btn-sm btn-print-portal-card" data-id="${esc(a.id)}" style="background:#fff; color:#16a34a; border-color:#86efac; font-weight:700;">
                <i data-lucide="printer"></i> Print Official Result Card
              </button>
            </div>

            <!-- Score breakdown: Total Marks & Out of Mark -->
            <div style="background:#f0fdf4; border:1.5px solid #86efac; border-radius:10px; padding:14px 18px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
              <div>
                <div style="font-size:0.75rem; color:#15803d; font-weight:800; text-transform:uppercase; letter-spacing:0.5px;">Assessment Marks</div>
                <div style="font-size:1.6rem; font-weight:900; color:#15803d; font-family:monospace; margin-top:2px;">
                  ${exam.totalScore ?? exam.marksObtained ?? '—'} <span style="font-size:1rem; font-weight:700; color:#475569;">/ ${exam.maxScore || 100}</span>
                </div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:0.75rem; color:#15803d; font-weight:800; text-transform:uppercase;">Performance</div>
                <div style="display:inline-block; font-size:1.3rem; font-weight:900; color:#16a34a; background:#dcfce7; padding:4px 12px; border-radius:6px; margin-top:2px;">
                  ${exam.percentage ? `${exam.percentage}%` : '—'}
                </div>
              </div>
            </div>

            <div style="background:#fff; border-left:4px solid #16a34a; border-radius:0 6px 6px 0; padding:10px 14px; font-size:0.83rem;">
              <strong>Admission Result Status:</strong> <span style="color:#15803d; font-weight:800;">${esc(exam.decision || 'Recommended for Admission')}</span>
              ${exam.examinerRemarks ? `<div style="color:#475569; margin-top:4px; font-size:0.79rem;"><strong>Feedback:</strong> ${esc(exam.examinerRemarks)}</div>` : ''}
            </div>
          </div>
        `;
      } else if (isScheduled) {
        // Scheduled for future publish date
        examSectionHtml = `
          <div style="background:#fffbeb; border:1.5px solid #fde68a; border-radius:10px; padding:16px; margin:16px 0;">
            <div style="display:flex; align-items:center; gap:8px; font-weight:800; color:#92400e; font-size:0.95rem; margin-bottom:4px;">
              <i data-lucide="clock" style="width:18px;height:18px;color:#d97706;"></i>
              ${esc(exam.examName || 'Weekly Admission Assessment')} &mdash; Results Scheduled
            </div>
            <p style="font-size:0.84rem; color:#78350f; margin:0 0 8px 0; line-height:1.45;">
              The applicant has completed their weekly entrance assessment. The official marks and committee evaluation are scheduled to be published on:
            </p>
            <div style="display:inline-flex; align-items:center; gap:6px; background:#fef3c7; border:1px solid #fcd34d; padding:6px 14px; border-radius:6px; font-weight:800; color:#92400e; font-size:0.88rem;">
              <i data-lucide="calendar" style="width:14px;height:14px;"></i>
              Publishing Date: ${fmtDate(exam.publishDate)}
            </div>
            <div style="font-size:0.74rem; color:#92400e; margin-top:8px;">
              Marks will be automatically revealed on this dashboard once the publication date is reached.
            </div>
          </div>
        `;
      } else if (hasScore) {
        // Evaluated but draft
        examSectionHtml = `
          <div style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:10px; padding:14px; margin:16px 0;">
            <div style="font-weight:700; color:#334155; font-size:0.88rem; display:flex; align-items:center; gap:6px;">
              <i data-lucide="file-check" style="width:16px;height:16px;color:#2563eb;"></i>
              ${esc(exam.examName || 'Weekly Admission Assessment')} Conducted
            </div>
            <p style="font-size:0.8rem; color:#64748b; margin:4px 0 0 0;">
              Evaluation is currently under administrative verification by the admission committee. Results will be published soon.
            </p>
          </div>
        `;
      } else {
        // Not yet evaluated
        examSectionHtml = `
          <div style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:14px; margin:16px 0;">
            <div style="font-weight:700; color:#1e40af; font-size:0.88rem; display:flex; align-items:center; gap:6px;">
              <i data-lucide="calendar" style="width:16px;height:16px;color:#2563eb;"></i>
              Weekly Admission Assessment Information
            </div>
            <p style="font-size:0.8rem; color:#3b82f6; margin:4px 0 0 0;">
              Thaiba Model School conducts weekly entrance assessments for applicants. Please attend campus with your Form No on your scheduled assessment date.
            </p>
          </div>
        `;
      }

      return `
        <div class="card" style="margin-bottom: 20px;">
          <div class="card-header" style="flex-wrap:wrap; gap:10px;">
            <div>
              <h3 class="card-title">${esc(a.studentName || 'Applicant')}</h3>
              <p class="card-desc">Form No <span class="font-mono">${esc(a.appId || a.id)}</span> &bull; Applied for ${esc(a.grade || '—')} &bull; ${fmtDate(a.createdAt)}</p>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
              ${a.status === 'Enrolled' ? `<span class="badge badge-success" style="font-weight:800;"><i data-lucide="graduation-cap"></i> Officially Enrolled (${esc(a.enrolledAdmissionNo || 'Student')})</span>` : ''}
              <span class="badge ${a.paymentStatus === 'Paid' ? 'badge-success' : (a.paymentStatus === 'Pending' ? 'badge-warning' : 'badge-info')}">
                Payment: ${esc(a.paymentStatus || '—')}
              </span>
            </div>
          </div>

          <div style="margin: 12px 0 16px;">${stepper(a.status)}</div>

          ${examSectionHtml}

          ${a.remarks ? `<div style="background:var(--bg-subtle); padding:12px; border-radius:8px; font-size:0.86rem; margin-bottom:14px;">
            <strong>Remarks from the school:</strong> ${esc(a.remarks)}</div>` : ''}

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
            <div>
              <h4 style="font-size:0.92rem; margin-bottom:8px; color:#15803d;">Fee Summary</h4>
              <table class="tms-table" style="font-size:0.83rem;"><tbody>
                ${(a.feeItems || []).map((f) => `<tr><th style="text-align:left;">${esc(f.name)}</th><td style="text-align:right;">${fmtMoney(f.amount)}</td></tr>`).join('') || '<tr><td style="color:var(--text-muted);">No fees.</td></tr>'}
                <tr><th style="text-align:left;">Total</th><td style="text-align:right; font-weight:800;">${fmtMoney(a.feeTotal)}</td></tr>
              </tbody></table>
            </div>
            <div>
              <h4 style="font-size:0.92rem; margin-bottom:8px; color:#15803d;">Payment Ledger</h4>
              <table class="tms-table" style="font-size:0.83rem;">
                <thead><tr><th>Date</th><th>Mode</th><th>Reference</th><th style="text-align:right;">Amount</th></tr></thead>
                <tbody>${ledger}</tbody>
              </table>
              ${a.paymentRef ? `<p style="font-size:0.78rem; color:var(--text-muted); margin-top:6px;">UPI reference on file: <span class="font-mono">${esc(a.paymentRef)}</span></p>` : ''}
            </div>
          </div>
        </div>`;
    }

    function notificationCard(n) {
      return `
        <div style="padding:12px; border:1px solid var(--border-color); border-left:4px solid ${n.isRead ? 'var(--border-color)' : '#16a34a'}; border-radius:8px; margin-bottom:10px; background:${n.isRead ? 'transparent' : 'rgba(22,163,74,0.04)'};">
          <div style="display:flex; justify-content:space-between; gap:10px;">
            <strong style="font-size:0.92rem;">${esc(n.title)}</strong>
            <span class="badge ${n.priority === 'Urgent' ? 'badge-danger' : (n.priority === 'High' ? 'badge-warning' : 'badge-info')}">${esc(n.priority || 'Normal')}</span>
          </div>
          <p style="font-size:0.84rem; color:var(--text-muted); margin-top:6px; white-space:pre-wrap;">${esc(n.message)}</p>
          <div style="font-size:0.72rem; color:var(--text-subtle); margin-top:6px;">${fmtDate(n.createdAt)}</div>
        </div>`;
    }

    (async () => {
      await authService.init();
      const user = authService.getCurrentUser();
      const allowed = user && [TMS_CONFIG.roles.PARENT, TMS_CONFIG.roles.ADMIN].includes(user.role);

      if (!allowed) {
        window.location.href = user ? '/dashboard' : '/login';
        return;
      }

      UIComponents.initTheme();
      brandingService.refresh();
      const logoutBtn = document.getElementById('btn-logout');
      if (logoutBtn) logoutBtn.addEventListener('click', () => authService.logout());

      await NotificationCenter.init();

      const content = document.getElementById('parent-content');
      let apps = [];
      let notifications = [];
      let students = [];
      let leaves = [];
      try {
        [apps, notifications, students, leaves] = await Promise.all([
          admissionService.listApplicationsForParent(user.id, user.email, user),
          notificationService.listForUser(),
          dbService.select('students'),
          StudentLeaveService.getLeaves()
        ]);
      } catch (e) {
        console.error(e);
      }

      const cleanParentEmail = (user.email || '').toLowerCase().trim();
      const cleanParentPhone = String(user.phone || '').replace(/\D/g, '');
      const cleanParentUsername = (user.username || (cleanParentEmail ? cleanParentEmail.split('@')[0] : '')).toLowerCase().trim();
      const isAdmin = user.role === TMS_CONFIG.roles.ADMIN || user.role === TMS_CONFIG.roles.SUPER_ADMIN || user.isSuperAdmin || cleanParentEmail.includes('admin') || cleanParentEmail === 'cmbasith786@gmail.com';

      // Link wards: match by parent email/phone/id/username/application
      let myWards = (students || []).filter(s => {
        const sEmail = (s.guardianEmail || s.email || '').toLowerCase().trim();
        const sPhone = (s.guardianPhone || s.phone || '').replace(/\D/g, '');
        const sAdmNo = (s.admissionNo || '').toLowerCase().trim();
        const sId = s.id || '';
        const sParentId = s.parentId || s.parent_id || '';

        if (cleanParentEmail && (sEmail === cleanParentEmail || sEmail.startsWith(cleanParentUsername + '@'))) return true;
        if (cleanParentPhone && cleanParentPhone.length >= 7 && (sPhone.includes(cleanParentPhone) || cleanParentPhone.includes(sPhone))) return true;
        if (user.id && (sParentId === user.id || sId === user.id)) return true;
        if (cleanParentUsername && sAdmNo === cleanParentUsername) return true;

        if (apps.some(a => a.enrolledAdmissionNo && a.enrolledAdmissionNo.toLowerCase() === sAdmNo)) return true;
        if (apps.some(a => a.studentName && s.fullName && a.studentName.toLowerCase().trim() === s.fullName.toLowerCase().trim())) return true;

        return false;
      });

      // Default active selections
      let currentMode = 'auto'; // 'auto', 'app', 'ward'
      let selectedAppId = apps[0]?.id || null;
      let selectedWardId = myWards[0]?.id || null;

      function renderParentDashboard() {
        let activeWard = null;
        let displayedApps = apps;

        if (isAdmin) {
          if (currentMode === 'ward' && selectedWardId) {
            activeWard = (students || []).find(s => s.id === selectedWardId) || null;
            displayedApps = apps.filter(a => a.enrolledAdmissionNo === activeWard?.admissionNo || (activeWard && a.studentName?.toLowerCase() === activeWard.fullName?.toLowerCase()));
          } else if (currentMode === 'app' && selectedAppId) {
            const targetApp = apps.find(a => a.id === selectedAppId);
            displayedApps = targetApp ? [targetApp] : apps;
            activeWard = null;
          } else {
            // Auto default for admin: prefer first applicant if available, else first student
            if (apps.length > 0) {
              currentMode = 'app';
              selectedAppId = apps[0].id;
              displayedApps = [apps[0]];
            } else if (students.length > 0) {
              currentMode = 'ward';
              selectedWardId = students[0].id;
              activeWard = students[0];
            }
          }
        } else {
          activeWard = myWards[0] || null;
        }

        const myWardLeaves = activeWard ? (leaves || []).filter(l => 
          l.studentId === activeWard.id || 
          l.admissionNo === activeWard.admissionNo || 
          (myWards.some(w => w.id === l.studentId || w.admissionNo === l.admissionNo))
        ) : [];

        let adminRibbonHtml = '';
        if (isAdmin) {
          adminRibbonHtml = `
            <div class="card" style="margin-bottom: 20px; background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%); border: 1.5px solid #0284c7; padding: 12px 18px;">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                <div style="display:flex; align-items:center; gap:10px;">
                  <span class="badge" style="background:#0284c7; color:#fff; font-weight:800; font-size:0.75rem; padding:4px 8px;">ADMIN PREVIEW MODE</span>
                  <span style="font-size:0.86rem; color:#0f172a; font-weight:600;">Previewing Parent Dashboard. Select Candidate Applicant or Enrolled Ward:</span>
                </div>
                <select id="admin-parent-preview-select" class="tms-form-select" style="font-size:0.84rem; padding:6px 12px; font-weight:600; min-width:300px; border-radius:6px; background:#fff; border:1px solid #cbd5e1;">
                  <optgroup label="Candidate Applicants (Weekly Exams &amp; Admissions)">
                    ${apps.map(a => `<option value="app:${a.id}" ${currentMode === 'app' && selectedAppId === a.id ? 'selected' : ''}>[Applicant] ${esc(a.studentName)} (${esc(a.appId || a.id)})</option>`).join('')}
                  </optgroup>
                  <optgroup label="Enrolled Students (Wards, Leaves &amp; Gate Passes)">
                    ${students.slice(0, 30).map(s => `<option value="ward:${s.id}" ${currentMode === 'ward' && selectedWardId === s.id ? 'selected' : ''}>[Enrolled] ${esc(s.fullName)} (${esc(s.admissionNo)} - ${esc(s.grade)})</option>`).join('')}
                  </optgroup>
                </select>
              </div>
            </div>
          `;
        }

        const renderLeaveCards = () => {
          if (!activeWard) {
            return `
              <div style="text-align: center; color: var(--text-muted); padding: 24px; background: var(--bg-subtle, #F8FAFC); border-radius: 10px;">
                <i data-lucide="user-x" style="width:36px; height:36px; display:block; margin:0 auto 8px; color: #94a3b8;"></i>
                <div style="font-weight: 600;">No Enrolled Wards Linked</div>
                <div style="font-size: 0.8rem; margin-top: 2px;">Your verified enrolled students will appear here once officially admitted.</div>
              </div>
            `;
          }
          if (!myWardLeaves.length) {
            return `
              <div style="text-align: center; color: var(--text-muted); padding: 24px; background: var(--bg-subtle, #F8FAFC); border-radius: 10px;">
                <i data-lucide="calendar-check" style="width:36px; height:36px; display:block; margin:0 auto 8px; color: #16a34a;"></i>
                <div style="font-weight: 600;">No Leave Requests on File for ${esc(activeWard.fullName)}</div>
                <div style="font-size: 0.8rem; margin-top: 2px;">Need to request an authorized absence or campus outpass? Click "Apply Leave for Ward" above.</div>
              </div>
            `;
          }

          return `
            <div class="table-responsive">
              <table class="tms-table" style="font-size: 0.85rem; width: 100%;">
                <thead>
                  <tr style="background: #F8FAFC;">
                    <th>STUDENT / WARD</th>
                    <th>LEAVE TYPE &amp; REASON</th>
                    <th>DURATION &amp; DATES</th>
                    <th>GATE PASS</th>
                    <th style="text-align:center;">STATUS</th>
                  </tr>
                </thead>
                <tbody>
                  ${myWardLeaves.map(l => {
                    let statusBadge = '';
                    if (l.status === 'APPROVED_ON_LEAVE' && !l.actualReturn) {
                      statusBadge = `<span class="badge" style="background:#FEF3C7; color:#92400E; border:1.5px solid #FCD34D; font-weight:800; font-size:0.75rem;"><i data-lucide="plane-takeoff" style="width:12px;height:12px;vertical-align:middle;"></i> ON LEAVE (Pass Active)</span>`;
                    } else if (l.status === 'PENDING') {
                      statusBadge = `<span class="badge badge-warning">Awaiting Staff Approval</span>`;
                    } else if (l.status === 'RETURNED' || l.actualReturn) {
                      statusBadge = `<span class="badge badge-success">✓ Returned (${esc((l.actualReturn || '').slice(0, 10))})</span>`;
                    } else if (l.status === 'REJECTED') {
                      statusBadge = `<span class="badge badge-danger">Declined</span>`;
                    } else {
                      statusBadge = `<span class="badge badge-info">${esc(l.status)}</span>`;
                    }

                    return `
                      <tr style="border-bottom: 1px solid var(--border-color);">
                        <td style="padding: 10px 12px;">
                          <div style="font-weight: 800; color: #0F172A;">${esc(l.studentName)}</div>
                          <div style="font-size: 0.74rem; color: #64748B;"><span class="tms-id-badge font-mono">${esc(l.admissionNo)}</span> • ${esc(l.grade)}</div>
                        </td>
                        <td style="padding: 10px 12px;">
                          <div style="font-weight: 700; color: #0F172A;">${esc(l.leaveType)}</div>
                          <div style="font-size: 0.74rem; color: #64748B;">${esc(l.reason)}</div>
                        </td>
                        <td style="padding: 10px 12px;">
                          <div style="font-weight: 700; color: #0F172A;">${esc(l.fromDate)} – ${esc(l.toDate)}</div>
                          <div style="font-size: 0.74rem; color: #16a34a; font-weight: 700;">${esc(l.totalDays)} Day(s)</div>
                        </td>
                        <td style="padding: 10px 12px;">
                          ${l.gatePassNo ? `
                            <span class="badge badge-info font-mono" style="font-size: 0.76rem; font-weight: 700;">${esc(l.gatePassNo)}</span>
                            <div style="font-size: 0.7rem; color: #64748B; margin-top: 2px;">Issued by: ${esc(l.issuedBy || 'Staff')}</div>
                          ` : '<span style="color: #94A3B8; font-size: 0.76rem;">Pending Approval</span>'}
                        </td>
                        <td style="padding: 10px 12px; text-align: center;">${statusBadge}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `;
        };

        if (activeWard) {
          // ENROLLED STUDENT PARENT VIEW
          content.innerHTML = `
            ${adminRibbonHtml}
            <div class="card" style="margin-bottom: 24px;">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
                <div>
                  <h2 style="font-size: 1.3rem;">Welcome, ${esc(user.name)}</h2>
                  <p style="color: var(--text-muted); font-size: 0.85rem;">
                    Enrolled Ward: <strong>${esc(activeWard.fullName)}</strong> (${esc(activeWard.admissionNo)} &bull; ${esc(activeWard.grade)})
                  </p>
                </div>
                <div style="display:flex; gap:8px;">
                  <span class="badge badge-info">${displayedApps.length} application(s)</span>
                  <span class="badge ${myWardLeaves.some(l => l.status === 'APPROVED_ON_LEAVE' && !l.actualReturn) ? 'badge-warning' : 'badge-success'}">
                    ${myWardLeaves.some(l => l.status === 'APPROVED_ON_LEAVE' && !l.actualReturn) ? 'Ward Currently ON LEAVE' : 'Campus In-Session'}
                  </span>
                </div>
              </div>
            </div>

            <!-- Ward Leave & Outpass Management Card -->
            <div class="card" style="margin-bottom: 24px;">
              <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <div>
                  <h3 class="card-title">Ward Leave &amp; Campus Outpass Requests</h3>
                  <p class="card-desc" style="margin: 2px 0 0 0;">
                    Apply for official student leaves, review staff approval, and view security gate passes for ${esc(activeWard.fullName)}.
                  </p>
                </div>
                <button type="button" class="btn btn-primary btn-sm" id="btn-parent-apply-leave" style="background:#0E623B; border-color:#0E623B; font-weight:700; border-radius:8px; display:inline-flex; align-items:center; gap:6px;">
                  <i data-lucide="plus"></i> Apply Leave for Ward
                </button>
              </div>
              <div id="parent-leaves-container" style="margin-top:14px;">
                ${renderLeaveCards()}
              </div>
            </div>

            <h3 style="font-size:1.1rem; margin-bottom:14px; font-weight:800;">Admission Records &amp; Assessment History</h3>
            ${displayedApps.length ? displayedApps.map(applicationCard).join('') : `
              <div class="card" style="text-align:center; padding:30px; margin-bottom:24px;">
                <p style="color:var(--text-muted); margin:0;">No additional admission applications on file.</p>
              </div>`}

            <h3 style="font-size:1.1rem; margin:24px 0 14px; font-weight:800;">School Announcements</h3>
            ${notifications.length ? notifications.map(notificationCard).join('') : `
              <div class="card" style="text-align:center; padding:30px;">
                <p style="color:var(--text-muted); margin:0;">No announcements right now.</p>
              </div>`}
          `;
        } else {
          // CANDIDATE APPLICANT PARENT VIEW
          content.innerHTML = `
            ${adminRibbonHtml}
            <div class="card" style="margin-bottom: 24px; border-left: 5px solid #2563eb; background:linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
                <div>
                  <span class="badge" style="background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; font-weight:800; font-size:0.75rem; margin-bottom:6px; display:inline-flex; align-items:center; gap:4px;">
                    <i data-lucide="clipboard-list" style="width:13px;height:13px;"></i> Applicant Admission &amp; Assessment Portal
                  </span>
                  <h2 style="font-size: 1.35rem; margin:0 0 4px 0; color:#0f172a;">Welcome, ${esc(user.name)}</h2>
                  <p style="color: var(--text-muted); font-size: 0.85rem; margin:0;">
                    Tracking <strong>${displayedApps.length} Admission Candidate Application(s)</strong> &bull; Review weekly entrance assessment marks, announcements &amp; admission progress.
                  </p>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                  <span class="badge badge-info" style="font-weight:700;"><i data-lucide="file-text" style="width:12px;height:12px;vertical-align:middle;"></i> ${displayedApps.length} Application(s)</span>
                  <span class="badge" style="background:#f0fdf4; color:#15803d; border:1px solid #86efac; font-weight:700;"><i data-lucide="award" style="width:12px;height:12px;vertical-align:middle;"></i> Weekly Evaluation</span>
                </div>
              </div>
            </div>

            <h3 style="font-size:1.15rem; margin-bottom:14px; font-weight:800; color:#0f172a; display:flex; align-items:center; gap:8px;">
              <i data-lucide="file-text" style="width:18px;height:18px;color:#2563eb;"></i> Candidate Applications &amp; Weekly Exam Marks
            </h3>
            ${displayedApps.length ? displayedApps.map(applicationCard).join('') : `
              <div class="card" style="text-align:center; padding:40px; margin-bottom:24px;">
                <i data-lucide="file-search" style="width:44px;height:44px;display:block;margin:0 auto 10px;color:var(--text-subtle);"></i>
                <div style="font-weight:700; color:#0f172a; margin-bottom:4px;">No Linked Applications Found</div>
                <p style="color:var(--text-muted); font-size:0.85rem; max-width:480px; margin:0 auto;">If you recently submitted an admission form, please verify you signed in with the username or mobile number on your application.</p>
              </div>`}

            <h3 style="font-size:1.15rem; margin:24px 0 14px; font-weight:800; color:#0f172a; display:flex; align-items:center; gap:8px;">
              <i data-lucide="bell" style="width:18px;height:18px;color:#16a34a;"></i> Admission Announcements &amp; Campus Notices
            </h3>
            ${notifications.length ? notifications.map(notificationCard).join('') : `
              <div class="card" style="text-align:center; padding:30px;">
                <p style="color:var(--text-muted); margin:0;">No announcements right now.</p>
              </div>`}

            <div class="card" style="margin-top:24px; background:#f8fafc; border:1px dashed #cbd5e1;">
              <div style="display:flex; align-items:flex-start; gap:12px;">
                <div style="width:36px; height:36px; border-radius:8px; background:#eff6ff; color:#2563eb; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                  <i data-lucide="shield-check" style="width:20px;height:20px;"></i>
                </div>
                <div style="font-size:0.8rem; color:#475569; line-height:1.5;">
                  <strong style="color:#0f172a;">Student Services &amp; Campus Leaves Activation:</strong><br>
                  Official student services including daily attendance tracking, campus leave requests, security gate passes, homework diaries, and term report cards will automatically activate in this portal once the candidate's admission is formally verified and enrolled as an official student.
                </div>
              </div>
            </div>
          `;
        }

        // Wire admin switcher
        const adminSelect = document.getElementById('admin-parent-preview-select');
        if (adminSelect) {
          adminSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val.startsWith('app:')) {
              currentMode = 'app';
              selectedAppId = val.replace('app:', '');
            } else if (val.startsWith('ward:')) {
              currentMode = 'ward';
              selectedWardId = val.replace('ward:', '');
            }
            renderParentDashboard();
          });
        }

        // Wire Print Result Card buttons in portal
        document.querySelectorAll('.btn-print-portal-card').forEach(btn => {
          btn.addEventListener('click', () => {
            const appId = btn.dataset.id;
            const targetApp = apps.find(x => x.id === appId);
            if (targetApp) admissionService.printResultCard(targetApp);
          });
        });

        // Wire parent leave apply button if enrolled ward present
        document.getElementById('btn-parent-apply-leave')?.addEventListener('click', () => {
          if (!activeWard) return;
          StudentLeaveService.openApplyModal({
            student: activeWard,
            appliedBy: 'parent',
            appliedByName: `${user.name} (Parent/Guardian)`,
            onComplete: async () => {
              const freshLeaves = await StudentLeaveService.getLeaves();
              const freshWardLeaves = freshLeaves.filter(l => l.studentId === activeWard.id || l.admissionNo === activeWard.admissionNo);
              const container = document.getElementById('parent-leaves-container');
              if (container) {
                container.innerHTML = `
                  <div class="table-responsive">
                    <table class="tms-table" style="font-size: 0.85rem; width: 100%;">
                      <thead>
                        <tr style="background: #F8FAFC;">
                          <th>STUDENT / WARD</th>
                          <th>LEAVE TYPE &amp; REASON</th>
                          <th>DURATION &amp; DATES</th>
                          <th>GATE PASS</th>
                          <th style="text-align:center;">STATUS</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${freshWardLeaves.map(l => `
                          <tr style="border-bottom: 1px solid var(--border-color);">
                            <td style="padding: 10px 12px;"><strong>${esc(l.studentName)}</strong></td>
                            <td style="padding: 10px 12px;">${esc(l.leaveType)}<br><small style="color:#64748B;">${esc(l.reason)}</small></td>
                            <td style="padding: 10px 12px;">${esc(l.fromDate)} – ${esc(l.toDate)} (${esc(l.totalDays)}d)</td>
                            <td style="padding: 10px 12px;"><span class="badge badge-info font-mono">${esc(l.gatePassNo || 'Pending')}</span></td>
                            <td style="padding: 10px 12px; text-align: center;"><span class="badge badge-warning">Awaiting Staff Approval</span></td>
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                `;
                UIComponents.refreshIcons();
              }
              UIComponents.showToast('Leave request submitted to school administration.', 'success');
            }
          });
        });

        UIComponents.refreshIcons();
      }

      renderParentDashboard();
    })();
  </script>
</body>
</html>
