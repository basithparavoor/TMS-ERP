<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — THAIBA MODEL SCHOOL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
  <link rel="stylesheet" href="app.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;">
  <div class="ambient-mesh">
    <div class="mesh-glow-1"></div>
    <div class="mesh-glow-2"></div>
  </div>

  <div style="max-width: 450px; width: 100%; position: relative; z-index: 10;">
    <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); padding: 36px 32px;">
      
      <!-- Official School Brand Header -->
      <div id="login-brand-container" style="text-align: center; margin-bottom: 28px;">
        <!-- Logo injected by script -->
      </div>

      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 1.35rem; font-weight: 700; color: var(--text-main);">Campus Management Gateway</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Sign in with your authorized institutional credentials</p>
      </div>

      <!-- Login Form -->
      <form id="tms-login-form">
        <div class="form-group">
          <label class="form-label">Institutional Email</label>
          <div style="position: relative;">
            <input type="email" class="form-input" id="login-email" required placeholder="cmbasith786@gmail.com" autofocus style="padding-left: 40px;">
            <i data-lucide="mail" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);"></i>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" style="margin-bottom: 0;">Password</label>
            <a href="javascript:void(0)" id="btn-forgot-password" style="font-size: 0.78rem; color: #16a34a; font-weight: 600;">Forgot Password?</a>
          </div>
          <div style="position: relative;">
            <input type="password" class="form-input" id="login-password" required placeholder="••••••••••••" style="padding-left: 40px;">
            <i data-lucide="lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);"></i>
          </div>
        </div>

        <div id="login-error-msg" style="display: none; padding: 10px 14px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); color: #ef4444; border-radius: var(--radius-md); font-size: 0.84rem; margin-bottom: 16px;"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem; margin-bottom: 18px;" id="btn-login-submit">
          <i data-lucide="log-in"></i> Sign In to Portal
        </button>
      </form>

      <!-- Public Student Admission Gateway Link -->
      <div style="border-top: 1px solid var(--border-color); padding-top: 18px; text-align: center;">
        <a href="student-admission-portal.html" class="btn btn-secondary" style="width: 100%; font-size: 0.85rem; padding: 10px;">
          <i data-lucide="file-text" style="color: #16a34a;"></i> Public Online Admission Portal
        </a>
      </div>

      <div style="margin-top: 20px; text-align: center; font-size: 0.75rem; color: var(--text-subtle);">
        Protected by Supabase Row-Level Security (RLS) & 256-Bit SSL Encryption<br>
        THAIBA MODEL SCHOOL • Run by Thaiba Heritage, Kolkata
      </div>
    </div>
  </div>

  <script type="module">
    import { authService } from './auth-service.js';
    import { UIComponents } from './ui-components.js';
    import { TMS_LOGO } from './logo.js';

    UIComponents.initTheme();
    document.getElementById('login-brand-container').innerHTML = `
      <div style="display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px;">
        ${TMS_LOGO.emblemSvg(64)}
      </div>
      <h1 style="font-size: 1.45rem; font-weight: 800; color: var(--text-main); letter-spacing: 0.04em;">
        THAIBA MODEL SCHOOL
      </h1>
      <div style="font-size: 0.75rem; color: #16a34a; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;">
        Run by : Thaiba Heritage, Kolkata
      </div>
      <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 2px;">
        Baghait, Tapan, Dakshin Dinajpur • Regd. No. : IV 01894/2011
      </div>
    `;
    UIComponents.refreshIcons();

    const form = document.getElementById('tms-login-form');
    const errBox = document.getElementById('login-error-msg');
    const submitBtn = document.getElementById('btn-login-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i data-lucide="loader-2" class="spin"></i> Authenticating...`;
      UIComponents.refreshIcons();

      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;

      const res = await authService.login(email, pass);
      if (res && res.success) {
        UIComponents.showToast(`Welcome back, ${res.user.name}!`, 'success');
        setTimeout(() => {
          window.location.href = 'index.html#/dashboard';
        }, 400);
      } else {
        errBox.innerText = res.error || 'Authentication failed. Please verify credentials.';
        errBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="log-in"></i> Sign In to Portal`;
        UIComponents.refreshIcons();
      }
    });

    document.getElementById('btn-forgot-password').addEventListener('click', () => {
      alert('Password reset link has been dispatched to your registered institutional email.');
    });
  </script>
</body>
</html>
